# /etc/nginx/sites-available/ai.webwonders.co.in
# sudo ln -sf /etc/nginx/sites-available/ai.webwonders.co.in /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name ai.webwonders.co.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ai.webwonders.co.in;

    # ssl_certificate /etc/letsencrypt/live/ai.webwonders.co.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ai.webwonders.co.in/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }
}
